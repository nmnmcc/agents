[package]
name = "agents"
version = "0.2.0"
edition = "2024"
description = "Run portable project agents through existing harness CLIs"

[dependencies]
anyhow = "1"
base64 = "0.22"
hopf-mailbox = "0.8.0"
ignore = "0.4"
json5 = "1.3"
jsonc-parser = { version = "0.34", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
email_address = { version = "0.2", default-features = false }
imap = { version = "=3.0.0-alpha.15", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
mail-parser = "0.11"
minijinja = { version = "2", features = ["json"] }
native-tls = "0.2"
rmcp = { version = "3.11", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
rquickjs = "0.14.0"

[dev-dependencies]
toml = "1"
