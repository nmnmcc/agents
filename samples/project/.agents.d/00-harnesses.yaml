# yaml-language-server: $schema=../../../agents.schema.json
harnesses:
  claude:
    program: claude
    args:
      - --print
      - --output-format
      - text
      - js: 'model === null ? null : ["--model", model]'
      - js: |
          session === null ? "--no-session-persistence"
          : [session.resume ? "--resume" : "--session-id", session.id]
      - --append-system-prompt-file
      - "{{ paths['instructions.md'] }}"
      - --strict-mcp-config
      - --mcp-config
      - "{{ paths['mcp.json'] }}"
    capabilities:
      mcp: [stdio, http]
      skills: true
      sessions: supplied
    files:
      instructions.md:
        format: text
        template: |
          {% if project_instructions is not none -%}
          # Project instructions

          {{ project_instructions }}

          {% endif -%}
          # Agent: {{ agent.id }}

          {{ agent.instructions }}
          {% if skills %}

          # Project skills

          Read the corresponding SKILL.md before applying a skill:
          {% for name in skills %}
          - {{ name }}: {{ skills[name] | tojson }}
          {% endfor %}
          {% endif %}
      mcp.json:
        format: json
        template: |
          {"mcpServers": {{ mcp | tojson }}}

  codex:
    program: codex
    args:
      - exec
      - js: 'session === null ? "--ephemeral" : session.resume ? null : "--json"'
      - --sandbox
      - read-only
      - --color
      - never
      - -c
      - |
        {% set instructions -%}
        {% if project_instructions is not none -%}
        {{ project_instructions }}

        {% endif -%}
        {{ agent.instructions }}
        {% if skills %}

        Read the corresponding SKILL.md before applying a skill:
        {% for name in skills %}
        - {{ name }}: {{ skills[name] | tojson }}
        {% endfor %}
        {% endif %}
        {%- endset -%}
        developer_instructions={{ instructions | tojson -}}
      - -c
      - js: |
          // JSON strings and arrays are valid TOML; tables become inline tables.
          const toml = (value) =>
            Array.isArray(value) ? `[${value.map(toml).join(", ")}]`
            : value !== null && typeof value === "object"
              ? `{${Object.entries(value).map(([k, v]) => `${JSON.stringify(k)} = ${toml(v)}`).join(", ")}}`
              : JSON.stringify(value);
          const servers = Object.entries(mcp).map(([name, server]) => [
            name,
            server.type === "stdio"
              ? { command: server.command, args: server.args, env: server.env, required: true }
              : { url: server.url, required: true },
          ]);
          "mcp_servers=" + toml(Object.fromEntries(servers))
      - js: 'model === null ? null : ["--model", model]'
      - js: 'session?.resume ? ["resume", session.id] : null'
      - "-"
    hooks:
      # Codex assigns its own thread UUID and reports it in a JSON event.
      stdout:
        js: |
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          let action = null;
          try {
            const event = JSON.parse(line);
            if (event.type === "thread.started" && uuid.test(event.thread_id)) {
              action = { session: event.thread_id };
            }
          } catch {}
          action
    capabilities:
      mcp: [stdio, http]
      skills: true
      sessions: reported

  opencode:
    program: opencode
    args:
      - --standalone
      - run
      - --agent
      - "agents-{{ agent.id }}"
      - js: 'model === null ? null : ["--model", model]'
      - js: 'session === null ? null : ["--session", "ses_" + session.id.replaceAll("-", "")]'
    env:
      OPENCODE_CONFIG: "{{ paths['opencode.json'] }}"
      OPENCODE_CONFIG_CONTENT: null
      OPENCODE_DB: { js: 'session === null ? ":memory:" : null' }
    hooks:
      # OpenCode starts a new session for an unknown ID; refuse to resume one that is gone.
      before:
        - - js: |
              session?.resume
                ? [program, "--standalone", "api", "get", "/api/session/ses_" + session.id.replaceAll("-", "")]
                : null
    capabilities:
      mcp: [stdio, http]
      skills: true
      sessions: supplied
    files:
      opencode.json:
        format: json
        template:
          js: |
            let system = (project_instructions === null ? "" : project_instructions + "\n\n")
              + agent.instructions.trimEnd();
            const names = Object.keys(skills);
            if (names.length > 0) {
              system += "\n\nRead the corresponding SKILL.md before applying a skill:\n"
                + names.map((name) => `- ${name}: ${JSON.stringify(skills[name])}`).join("\n");
            }
            const servers = Object.entries(mcp).map(([name, server]) => [
              name,
              server.type === "stdio"
                ? { type: "local", command: [server.command, ...server.args], environment: server.env }
                : { type: "remote", url: server.url },
            ]);
            ({
              $schema: "https://opencode.ai/config.json",
              agents: {
                [`agents-${agent.id}`]: { mode: "primary", description: agent.description, system },
              },
              mcp: { servers: Object.fromEntries(servers) },
            })
