# yaml-language-server: $schema=../../../agents.schema.json
harnesses:
  claude:
    version: 1
    program: claude
    args:
      - --print
      - --output-format
      - text
      - when: model is not none
        args: [--model, "{{ model }}"]
      - when: session is none
        args: [--no-session-persistence]
      - when: session is not none
        args:
          - when: session.resume
            args: [--resume, "{{ session.id }}"]
          - when: not session.resume
            args: [--session-id, "{{ session.id }}"]
      - --append-system-prompt-file
      - "{{ paths['instructions.md'] }}"
      - --strict-mcp-config
      - --mcp-config
      - "{{ paths['mcp.json'] }}"
    capabilities:
      mcp: [stdio, http]
      skills: true
      sessions: true
    files:
      instructions.md:
        format: text
        template: |
          {% if project_instructions is not none -%}
          # Project instructions

          {{ project_instructions }}

          {% endif -%}
          # Agent: {{ agent.id }}

          {{ agent.instructions }}
          {% if skills %}

          # Project skills

          Read the corresponding SKILL.md before applying a skill:
          {% for name in skills %}
          - {{ name }}: {{ skills[name] | tojson }}
          {% endfor %}
          {% endif %}
      mcp.json:
        format: json
        template: |
          {"mcpServers": {{ mcp | tojson }}}

  codex:
    version: 1
    program: codex
    args:
      - exec
      - when: session is none
        args: [--ephemeral]
      - when: session is not none
        args:
          - when: not session.resume
            args: [--json]
      - --sandbox
      - read-only
      - --color
      - never
      - -c
      - template: |
          {% set instructions -%}
          {% if project_instructions is not none -%}
          {{ project_instructions }}

          {% endif -%}
          {{ agent.instructions }}
          {% if skills %}

          Read the corresponding SKILL.md before applying a skill:
          {% for name in skills %}
          - {{ name }}: {{ skills[name] | tojson }}
          {% endfor %}
          {% endif %}
          {%- endset -%}
          developer_instructions={{ instructions | totoml -}}
      - -c
      - template: |
          mcp_servers={
          {%- for name in mcp -%}
          {%- set server = mcp[name] -%}
          {{ name }} = {
          {%- if server.type == 'stdio' -%}
          command = {{ server.command | totoml }}, args = {{ server.args | totoml }}, env = {{ server.env | totoml }}
          {%- else -%}
          url = {{ server.url | totoml }}
          {%- endif -%}
          , required = true}
          {%- if not loop.last %}, {% endif -%}
          {%- endfor -%}
          }
          {{- '' -}}
      - when: model is not none
        args: [--model, "{{ model }}"]
      - when: session is not none
        args:
          - when: session.resume
            args: [resume, "{{ session.id }}"]
      - "-"
    session_id_event: { event: thread.started, field: thread_id, uuid: true }
    capabilities:
      mcp: [stdio, http]
      skills: true
      sessions: true

  opencode:
    version: 1
    program: opencode
    args:
      - --standalone
      - run
      - --agent
      - "agents-{{ agent.id }}"
      - when: model is not none
        args: [--model, "{{ model }}"]
      - when: session is not none
        args: [--session, "ses_{{ session.id | replace('-', '') }}"]
    env:
      OPENCODE_CONFIG: "{{ paths['opencode.json'] }}"
      OPENCODE_CONFIG_CONTENT: null
      OPENCODE_DB: "{{ ':memory:' if session is none else session.directory ~ '/opencode-' ~ agent.id ~ '.sqlite' }}"
    session_resume_check:
      - --standalone
      - api
      - get
      - "/api/session/ses_{{ session.id | replace('-', '') }}"
    capabilities:
      mcp: [stdio, http]
      skills: true
      sessions: true
    files:
      opencode.json:
        format: json
        template: |
          {% set system -%}
          {% if project_instructions is not none -%}
          {{ project_instructions }}

          {% endif -%}
          {{ agent.instructions }}
          {% if skills %}

          Read the corresponding SKILL.md before applying a skill:
          {% for name in skills %}
          - {{ name }}: {{ skills[name] | tojson }}
          {% endfor %}
          {% endif %}
          {%- endset -%}
          {
            "$schema": "https://opencode.ai/config.json",
            "agents": {
              {{ ('agents-' ~ agent.id) | tojson }}: {
                "mode": "primary",
                "description": {{ agent.description | tojson }},
                "system": {{ system | tojson }}
              }
            },
            "mcp": {
              "servers": {
                {% for name in mcp %}
                {% set server = mcp[name] %}
                {{ name | tojson }}:
                {% if server.type == 'stdio' %}
                  {{ {'type': 'local', 'command': [server.command] + server.args, 'environment': server.env} | tojson }}
                {% else %}
                  {{ {'type': 'remote', 'url': server.url} | tojson }}
                {% endif %}
                {% if not loop.last %},{% endif %}
                {% endfor %}
              }
            }
          }
